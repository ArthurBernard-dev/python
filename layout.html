<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}{% endblock %} | Meu Site</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('curriculo') }}">Currículo</a>
            <a href="{{ url_for('expectativas') }}">Expectativas</a>
        </nav>
    </header>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>

    <footer>
        <p>Criado com amor (e linhas de código) &copy; 2026</p>
    </footer>

</body>
</html>
